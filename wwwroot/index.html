<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GadgetShop - Premium Electronics & Gadgets Store" />
    <title>GadgetShop</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#7C3AED" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link href="css/premium-theme.css" rel="stylesheet" />

    <base href="/" />
</head>
<body>
    <div id="app">
        <div style="
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            background:linear-gradient(135deg,#f3f0ff 0%,#fef9ee 100%);
            gap:1rem;
            font-family:'Inter',sans-serif;
        ">
            <div style="
                width:60px;height:60px;
                background:linear-gradient(135deg,#7C3AED,#A78BFA);
                border-radius:16px;
                display:flex;align-items:center;justify-content:center;
                box-shadow:0 8px 24px rgba(124,58,237,.3);
                animation:spin 1s linear infinite;
            ">
                <span class="material-icons-round" style="color:white;font-size:32px">electric_bolt</span>
            </div>
            <div style="font-size:1.4rem;font-weight:700;color:#111">
                <span style="color:#7C3AED">Gadget</span>Shop
            </div>
            <div style="color:#9CA3AF;font-size:.875rem">Loading...</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="
        background:linear-gradient(135deg,#EF4444,#DC2626);
        bottom:0; left:0; right:0;
        color:white; padding:16px 24px;
        position:fixed; z-index:9999; border-radius:0;
        display:none; align-items:center; justify-content:space-between;
    ">
        <span>An unhandled error has occurred. <a href="" style="color:white;font-weight:600">Reload</a></span>
        <a onclick="document.getElementById('blazor-error-ui').style.display='none'"
           style="cursor:pointer;color:white;font-size:1.5rem;line-height:1">x</a>
    </div>

    <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        window.scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        window.initiateRazorpay = (options, dotnetRef) => {
            const rzp = new Razorpay({
                ...options,
                handler: function (response) {
                    dotnetRef.invokeMethodAsync('OnPaymentSuccess', response);
                }
            });
            rzp.on('payment.failed', function (response) {
                dotnetRef.invokeMethodAsync('OnPaymentFailed', response.error);
            });
            rzp.open();
        };

        window.copyToClipboard = (text) => navigator.clipboard.writeText(text);
    </script>
</body>
</html>
